apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: medicalfield
labels:
  - pairs:
      app.kubernetes.io/part-of: medicalfield
resources:
  - namespace.yaml
  - postgres
  - mike-baguncinha
  - dona-cida
  - jaiminho
  - web
  - mailpit
  - backup
  - gateway
  - networkpolicies
# Configuracao nao sensivel comum aos tres servicos (docs/contratos.md, secao 4)
configMapGenerator:
  - name: configuracao-comum
    literals:
      - PORTA=8080
      - PORTA_GESTAO=9090
      - AMBIENTE=producao
      - NIVEL_LOG=info
      # Pods do k3s (inclui o Traefik): so deles se aceita X-Forwarded-For
      - PROXIES_CONFIAVEIS=127.0.0.1/32,::1/128,10.42.0.0/16
