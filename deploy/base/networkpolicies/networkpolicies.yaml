# Rede do namespace: tudo negado por padrao; cada liberacao abaixo e um caminho real do sistema.
# (O kubelet do proprio no continua alcancando os pods para as probes.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: negar-tudo
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: liberar-dns
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Traefik -> API dos tres servicos e web (porta 8080; nunca a de gestao)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-para-servicos-e-web
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["mike-baguncinha", "dona-cida", "jaiminho", "web"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 8080 }
---
# Servicos (e as migracoes, que rodam no mesmo pod) e backup -> Postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-entrada
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["mike-baguncinha", "dona-cida", "jaiminho", "backup"]
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saida-para-postgres
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["mike-baguncinha", "dona-cida", "jaiminho", "backup"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - { protocol: TCP, port: 5432 }
---
# JWKS: DonaCida e Jaiminho buscam a chave publica na porta de gestao do Mike
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mike-jwks-entrada
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mike-baguncinha
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["dona-cida", "jaiminho"]
      ports:
        - { protocol: TCP, port: 9090 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saida-para-jwks
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["dona-cida", "jaiminho"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mike-baguncinha
      ports:
        - { protocol: TCP, port: 9090 }
---
# Jaiminho -> DonaCida (GET /api/v1/ficha/{id}, repassando o JWT do usuario)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dona-cida-entrada-do-jaiminho
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dona-cida
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaiminho
      ports:
        - { protocol: TCP, port: 8080 }
---
# Jaiminho -> DonaCida, Mailpit e SMTP externo (587 STARTTLS / 465 TLS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaiminho-saida
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jaiminho
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dona-cida
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mailpit
      ports:
        - { protocol: TCP, port: 1025 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 587 }
        - { protocol: TCP, port: 465 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailpit-entrada-do-jaiminho
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaiminho
      ports:
        - { protocol: TCP, port: 1025 }
