# pg_dump diario do banco inteiro, formato custom, em volume proprio. Mantem os 7 mais recentes.
# Rodar agora: deploy/scripts/backup.sh   |   Restaurar: deploy/scripts/restore.sh
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  labels:
    app.kubernetes.io/name: backup
spec:
  schedule: "15 3 * * *"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup
        spec:
          serviceAccountName: backup
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:17-alpine
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  arquivo="/backups/medicalfield-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  # Grava com nome temporario: um dump interrompido nunca conta como backup
                  pg_dump --format=custom --file="$arquivo.parcial" "$DATABASE_URL"
                  mv "$arquivo.parcial" "$arquivo"
                  ls -1t /backups/medicalfield-*.dump | tail -n +8 | xargs -r rm -f
                  rm -f /backups/*.parcial
                  ls -lh /backups
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credenciais
                      key: ADMIN_DATABASE_URL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: backups
            - name: tmp
              emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
  labels:
    app.kubernetes.io/name: backup
  annotations:
    # O Argo CD nunca apaga este volume
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
