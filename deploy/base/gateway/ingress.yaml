# freeway: o API Gateway. Rotas de docs/contratos.md, secao 1. O prefixo NAO e removido:
# cada servico atende em /api/v1/... O gateway nao autentica (cada servico valida o JWT).
# A porta de gestao (9090) dos servicos nunca e roteada aqui.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freeway
  labels:
    app.kubernetes.io/name: freeway
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: medicalfield-erros-json@kubernetescrd,medicalfield-cabecalhos-seguranca@kubernetescrd,medicalfield-cors-app@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # MikeBaguncinha
          - { path: /api/v1/auth, pathType: Prefix, backend: { service: { name: mike-baguncinha, port: { name: http } } } }
          - { path: /api/v1/log, pathType: Prefix, backend: { service: { name: mike-baguncinha, port: { name: http } } } }
          - { path: /api/v1/auditoria, pathType: Prefix, backend: { service: { name: mike-baguncinha, port: { name: http } } } }
          # Jaiminho
          - { path: /api/v1/documento, pathType: Prefix, backend: { service: { name: jaiminho, port: { name: http } } } }
          # DonaCida
          - { path: /api/v1/medicamento, pathType: Prefix, backend: { service: { name: dona-cida, port: { name: http } } } }
          - { path: /api/v1/pessoa, pathType: Prefix, backend: { service: { name: dona-cida, port: { name: http } } } }
          - { path: /api/v1/prontuario, pathType: Prefix, backend: { service: { name: dona-cida, port: { name: http } } } }
          - { path: /api/v1/prontuario-item, pathType: Prefix, backend: { service: { name: dona-cida, port: { name: http } } } }
          - { path: /api/v1/atendimento, pathType: Prefix, backend: { service: { name: dona-cida, port: { name: http } } } }
          - { path: /api/v1/atendimento-evento, pathType: Prefix, backend: { service: { name: dona-cida, port: { name: http } } } }
          - { path: /api/v1/ficha, pathType: Prefix, backend: { service: { name: dona-cida, port: { name: http } } } }
          - { path: /api/v1/sync, pathType: Prefix, backend: { service: { name: dona-cida, port: { name: http } } } }
          # web (portal BradPitt e app LuckyPatcher); "/" redireciona para /portal/
          - { path: /portal, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } }
          - { path: /app, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } }
          - { path: /, pathType: Exact, backend: { service: { name: web, port: { name: http } } } }
---
# Mesma rota de login, em Ingress separado so para receber o limite de taxa.
# O Traefik ordena as rotas pelo TAMANHO da regra, e Path(/api/v1/auth/login) empata com
# PathPrefix(/api/v1/auth): sem prioridade explicita o limite de taxa ficava ligado ou desligado
# ao acaso (D-QA-04). A anotacao router.priority abaixo garante que esta rota vence.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freeway-login
  labels:
    app.kubernetes.io/name: freeway
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "1000"
    traefik.ingress.kubernetes.io/router.middlewares: medicalfield-limite-login@kubernetescrd,medicalfield-erros-json@kubernetescrd,medicalfield-cabecalhos-seguranca@kubernetescrd,medicalfield-cors-app@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - { path: /api/v1/auth/login, pathType: Exact, backend: { service: { name: mike-baguncinha, port: { name: http } } } }
