apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaiminho
  labels:
    app.kubernetes.io/name: jaiminho
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaiminho
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaiminho
    spec:
      serviceAccountName: jaiminho
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Migracoes do servico, como administrador do banco, antes da versao que precisa delas.
        # A imagem "migracoes" leva a mesma tag do servico (deploy/migracoes/Dockerfile).
        - name: migracoes
          image: medicalfield-migracoes
          imagePullPolicy: IfNotPresent
          args:
            - --wait
            - --wait-timeout=120s
            - --migrations-dir=/migracoes/jaiminho
            - --migrations-table=documentos.schema_migrations
            - --no-dump-schema
            - up
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credenciais
                  key: ADMIN_DATABASE_URL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: jaiminho
          image: medicalfield-jaiminho
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: gestao
              containerPort: 9090
          env:
            - name: HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: configuracao-comum
            - configMapRef:
                name: jaiminho-configuracao
            # DATABASE_URL com o papel restrito do servico (deploy/scripts/criar-secrets.sh)
            - secretRef:
                name: jaiminho-segredos
          startupProbe:
            httpGet:
              path: /health/live
              port: gestao
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: gestao
            periodSeconds: 5
            timeoutSeconds: 3
          # Liveness nao confere o banco: se o Postgres oscilar, os servicos nao reiniciam em cascata
          livenessProbe:
            httpGet:
              path: /health/live
              port: gestao
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Da tempo de o Traefik tirar o pod da rota antes do SIGTERM
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
