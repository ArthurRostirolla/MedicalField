apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - service.yaml
  - deployment.yaml
configMapGenerator:
  - name: jaiminho-configuracao
    literals:
      - JWKS_URL=http://mike-baguncinha:9090/jwks.json
      - CLINICO_URL=http://dona-cida:8080
      # Os overlays trocam a URL publica e, se houver, o SMTP externo.
      # SMTP_USUARIO / SMTP_SENHA, quando existem, vem do Secret "jaiminho-segredos".
      - URL_PUBLICA_PORTAL=http://localhost:8088/portal
      - SMTP_HOST=mailpit
      - SMTP_PORTA=1025
      - SMTP_SEGURANCA=nenhuma
      - EMAIL_REMETENTE=MedicalField <nao-responda@medicalfield.invalid>
