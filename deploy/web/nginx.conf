# Servidor estatico do portal (/portal/) e do app PWA (/app/). Roda sem root, na 8080.
# As chamadas /api/v1/... NAO passam por aqui: o gateway (Traefik) as roteia direto aos servicos.

# Tudo que nao e asset com hash: sempre revalidar (index.html, service worker, manifesto)
map $uri $cache_control {
    default            "no-cache";
    ~^/(portal|app)/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Valem para todas as respostas (nenhum location abaixo declara add_header proprio)
    # Sem "always": resposta de erro (404) nao leva cache longo
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # 'wasm-unsafe-eval' e blob: atendem o SQLite em WebAssembly do app; estilo inline e do React
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Corpo de erro do contrato para 502/503/504 do gateway (middleware erros-json do Traefik).
    location = /_erros/indisponivel.json {
        default_type application/json;
        return 200 '{"codigo":"SERVICO_INDISPONIVEL","mensagem":"Servico temporariamente indisponivel. Tente de novo em instantes.","detalhes":null,"requestId":null}';
    }

    location = / {
        return 302 /portal/;
    }
    location = /portal {
        return 301 /portal/;
    }
    location = /app {
        return 301 /app/;
    }

    # Asset com hash que nao existe e 404 de verdade (nunca devolve o index.html como se fosse JS)
    location ~ ^/(portal|app)/assets/ {
        try_files $uri =404;
    }

    # SPA: rota desconhecida cai no index.html do respectivo front
    location /portal/ {
        try_files $uri $uri/ /portal/index.html;
    }
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        return 404;
    }
}

# Porta de gestao: so as probes do Kubernetes; nunca roteada pelo gateway
server {
    listen 9090;
    server_name _;
    access_log off;
    location /health/ {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
