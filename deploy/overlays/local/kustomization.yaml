# Cluster local (deploy/scripts/cluster-local.sh): imagens construidas na maquina, tag "dev".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: medicalfield-mike-baguncinha
    newTag: dev
  - name: medicalfield-dona-cida
    newTag: dev
  - name: medicalfield-jaiminho
    newTag: dev
  - name: medicalfield-web
    newTag: dev
  - name: medicalfield-migracoes
    newTag: dev
configMapGenerator:
  # Cluster local de demonstracao: carrega profissionais, pessoas e medicamentos ficticios.
  - name: postgres-configuracao
    namespace: medicalfield
    behavior: merge
    literals:
      - DADOS_DEMO=on
  - name: jaiminho-configuracao
    namespace: medicalfield
    behavior: merge
    literals:
      - URL_PUBLICA_PORTAL=http://localhost:8088/portal
      # E-mails caem no Mailpit do proprio cluster
      - SMTP_HOST=mailpit
      - SMTP_PORTA=1025
      - SMTP_SEGURANCA=nenhuma
