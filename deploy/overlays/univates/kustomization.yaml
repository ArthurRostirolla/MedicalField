# VM da Univates. E o caminho que o Argo CD sincroniza (deploy/argocd/application.yaml).
#
# TROCAR antes da primeira sincronizacao (procure por "TROCAR"):
#   1. host-publico.exemplo.invalid -> nome pelo qual o sistema sera acessado (2 lugares abaixo)
#   2. dono-do-registro             -> dono do GHCR. O CI ja troca sozinho no primeiro push em
#                                      main (newName e newTag); a mao so se nao for usar o CI.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: medicalfield-mike-baguncinha
    newName: ghcr.io/dono-do-registro/medicalfield-mike-baguncinha # TROCAR (CI)
    newTag: inicial
  - name: medicalfield-dona-cida
    newName: ghcr.io/dono-do-registro/medicalfield-dona-cida # TROCAR (CI)
    newTag: inicial
  - name: medicalfield-jaiminho
    newName: ghcr.io/dono-do-registro/medicalfield-jaiminho # TROCAR (CI)
    newTag: inicial
  - name: medicalfield-web
    newName: ghcr.io/dono-do-registro/medicalfield-web # TROCAR (CI)
    newTag: inicial
  - name: medicalfield-migracoes
    newName: ghcr.io/dono-do-registro/medicalfield-migracoes # TROCAR (CI)
    newTag: inicial
configMapGenerator:
  # TROCAR para "off" se este ambiente for receber dados reais: "on" cria a conta ADMIN de demonstracao, cuja senha e publica.
  - name: postgres-configuracao
    namespace: medicalfield
    behavior: merge
    literals:
      - DADOS_DEMO=on
  - name: jaiminho-configuracao
    namespace: medicalfield
    behavior: merge
    literals:
      - URL_PUBLICA_PORTAL=https://host-publico.exemplo.invalid/portal # TROCAR
      # SMTP: o padrao e o Mailpit do cluster (contingencia do passo 17). Para SMTP externo,
      # descomente e ajuste; usuario e senha vao no Secret (deploy/secrets.env -> criar-secrets.sh).
      # - SMTP_HOST=smtp.gmail.com
      # - SMTP_PORTA=587
      # - SMTP_SEGURANCA=starttls
      # - EMAIL_REMETENTE=MedicalField <conta@gmail.com>
patches:
  # So atende pelo nome publico
  - target:
      kind: Ingress
      name: freeway
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: host-publico.exemplo.invalid # TROCAR
  - target:
      kind: Ingress
      name: freeway-login
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: host-publico.exemplo.invalid # TROCAR
