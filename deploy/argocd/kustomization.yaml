# Argo CD enxuto: application-controller, repo-server, server (UI) e redis.
# Fora: Dex (SSO), notifications e applicationset. Versao fixada; para atualizar, troque a URL.
#   kubectl apply --server-side -k deploy/argocd
#   kubectl apply -f deploy/argocd/application.yaml      (depois; ver docs/operacao/instalacao-vm.md)
# A UI nunca e exposta publicamente: kubectl -n argocd port-forward svc/argocd-server 8443:443
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/manifests/install.yaml
patches:
  # Remove tudo o que pertence aos tres componentes dispensados
  - target:
      name: argocd-(dex-server|notifications-controller|applicationset-controller).*
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Qualquer
      metadata:
        name: qualquer
  - target:
      name: argocd-notifications-(cm|secret)
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Qualquer
      metadata:
        name: qualquer
  # Limites de memoria coerentes com o orcamento (plano, secao K): ~1 GB no total
  - target: { kind: StatefulSet, name: argocd-application-controller }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 640Mi } }
  - target: { kind: Deployment, name: argocd-repo-server }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 25m, memory: 128Mi }, limits: { memory: 384Mi } }
  - target: { kind: Deployment, name: argocd-server }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 25m, memory: 96Mi }, limits: { memory: 256Mi } }
  - target: { kind: Deployment, name: argocd-redis }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
