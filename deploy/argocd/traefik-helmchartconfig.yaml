# Ajuste do Traefik que ja vem no k3s. Fica FORA do Argo CD (o k3s e o dono do Traefik):
#   kubectl apply -f deploy/argocd/traefik-helmchartconfig.yaml
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        # Preserva o IP de origem do cliente ate o Traefik
        externalTrafficPolicy: Local
    additionalArguments:
      # So aceita X-Forwarded-* vindo destes enderecos; de qualquer outro par o cabecalho
      # enviado pelo cliente e descartado e o Traefik grava o IP real da conexao.
      # TROCAR se houver uma borda na frente (ex.: Tailscale Funnel no host): acrescente o
      # IP com que ela chega ao Traefik (veja docs/operacao/acesso-publico.md).
      - "--entryPoints.web.forwardedHeaders.trustedIPs=127.0.0.1/32"
      - "--entryPoints.websecure.forwardedHeaders.trustedIPs=127.0.0.1/32"
