# O unico Application: sincroniza deploy/overlays/univates com o namespace medicalfield.
# Aplicar DEPOIS de instalar o Argo CD e de criar os Secrets (deploy/scripts/criar-secrets.sh).
# Nao gerencia o Traefik (e do k3s; ajuste em traefik-helmchartconfig.yaml) nem os Secrets.
# Nao apaga volume: o PVC do Postgres nasce do StatefulSet (fora do rastreio do Argo CD) e o
# PVC de backups e o namespace levam "Prune=false,Delete=false". Sem finalizer de cascata:
# apagar este Application nao apaga o que esta no cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medicalfield
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DONO-DO-REPOSITORIO/medicalfield.git # TROCAR
    targetRevision: main
    path: deploy/overlays/univates
  destination:
    server: https://kubernetes.default.svc
    namespace: medicalfield
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
