name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  mike-baguncinha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/mike-baguncinha/go.mod
          cache-dependency-path: apps/mike-baguncinha/go.sum
      # Banco de teste igual ao de desenvolvimento (apps/mike-baguncinha/README.md)
      - name: Banco de teste
        run: |
          scripts/dev-db.sh subir
          scripts/dev-db.sh criar-banco mf_teste_mike
          scripts/dev-db.sh migrar mf_teste_mike
      - name: Vet e testes
        working-directory: apps/mike-baguncinha
        env:
          DATABASE_URL_TESTE: postgres://mf_mike:dev_mike@localhost:5544/mf_teste_mike?sslmode=disable
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  jaiminho:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/jaiminho/pyproject.toml
      - name: Bibliotecas do WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 fonts-lato fonts-dejavu-core
      - name: Banco de teste
        run: |
          scripts/dev-db.sh subir
          scripts/dev-db.sh criar-banco mf_teste_jaiminho
          scripts/dev-db.sh migrar mf_teste_jaiminho
      - name: Lint e testes
        working-directory: apps/jaiminho
        env:
          TESTE_DATABASE_URL: postgresql://mf_jaiminho:dev_jaiminho@localhost:5544/mf_teste_jaiminho
          TESTE_DATABASE_URL_ADMIN: postgresql://postgres:dev_admin@localhost:5544/mf_teste_jaiminho
        run: |
          pip install -e ".[dev]"
          ruff check .
          pytest

  npm:
    # packages/*, apps/dona-cida e os dois front-ends
    runs-on: ubuntu-latest
    env:
      WORKSPACES: >-
        --workspace=packages/contratos --workspace=packages/dominio --workspace=packages/ui
        --workspace=apps/dona-cida --workspace=apps/brad-pitt --workspace=apps/lucky-patcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Banco de teste da DonaCida
        run: |
          scripts/dev-db.sh subir
          scripts/dev-db.sh criar-banco mf_teste_cida
          scripts/dev-db.sh migrar mf_teste_cida
      - run: npm run typecheck --if-present $WORKSPACES
      - run: npm test --if-present $WORKSPACES

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose valida o modo local e o da VM
        working-directory: deploy
        run: |
          cp .env.example .env
          printf '%s\n' SENHA_POSTGRES_ADMIN=x SENHA_MF_MIKE=x SENHA_MF_CIDA=x SENHA_MF_JAIMINHO=x JWT_CHAVE_PRIVADA_PEM=x MF_HOST=exemplo.invalid MF_ACME_EMAIL=x@exemplo.invalid >> .env
          docker compose config -q
          docker compose -f compose.yaml -f compose.vm.yaml config -q

  imagens:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [mike-baguncinha, jaiminho, npm, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { peca: mike-baguncinha, contexto: apps/mike-baguncinha, dockerfile: apps/mike-baguncinha/Dockerfile }
          - { peca: dona-cida, contexto: ., dockerfile: apps/dona-cida/Dockerfile }
          - { peca: jaiminho, contexto: apps/jaiminho, dockerfile: apps/jaiminho/Dockerfile }
          - { peca: web, contexto: ., dockerfile: deploy/web/Dockerfile }
          - { peca: migracoes, contexto: ., dockerfile: deploy/migracoes/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome da imagem (o GHCR exige minusculas)
        id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/medicalfield-${{ matrix.peca }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.nome.outputs.imagem }}:${{ github.sha }}
            ${{ steps.nome.outputs.imagem }}:latest
          cache-from: type=gha,scope=${{ matrix.peca }}
          cache-to: type=gha,mode=max,scope=${{ matrix.peca }}
