          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA, emitido pelo MikeBaguncinha)
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: UUID da operação; o app sempre envia em escritas.
    DispositivoId:
      name: X-Dispositivo-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: false
