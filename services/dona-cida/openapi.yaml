openapi: 3.1.0
info:
  title: MedicalField — DonaCida (núcleo clínico e sincronização)
  version: 0.1.0
  description: "Gerado por scripts/gerar-openapi.ts a partir de @medicalfield/contratos; a fonte de verdade é
    docs/contratos.md. DADOS DEMONSTRATIVOS — SEM VALIDADE CLÍNICA. Escritas: o id da entidade vem do cliente; com
    Idempotency-Key, a repetição devolve 200 com a resposta original. 4xx = rejeição definitiva; rede/5xx =
    transitório."
servers:
  - url: /api/v1
security:
  - bearer: []
paths:
  /medicamento:
    get:
      summary: Lista o catálogo de medicamentos
      tags:
        - medicamento
      parameters:
        - name: limite
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: incluirInativos
          in: query
          required: false
          schema:
            default: "false"
            type: string
            enum:
              - "true"
              - "false"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaMedicamento"
        "401":
          description: NAO_AUTENTICADO — token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "422":
          description: VALIDACAO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "500":
          description: ERRO_INTERNO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "503":
          description: SERVICO_INDISPONIVEL — banco ou serviço de identidade fora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /prontuario:
    get:
      summary: Lista todos os prontuários, com a pessoa resumida
      tags:
        - prontuario
      parameters:
        - name: limite
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaProntuario"
        "401":
          description: NAO_AUTENTICADO — token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "422":
          description: VALIDACAO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "500":
          description: ERRO_INTERNO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "503":
          description: SERVICO_INDISPONIVEL — banco ou serviço de identidade fora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
    post:
      summary: Cadastra o prontuário; se a pessoa já tem, devolve o existente com os itens unidos
      tags:
        - prontuario
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DispositivoId"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProntuarioEntrada"
      responses:
        "200":
          description: Repetição do comando, ou o registro já existia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prontuario"
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prontuario"
        "401":
          description: NAO_AUTENTICADO — token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "422":
          description: VALIDACAO (corpo inválido ou referência inexistente) ou CHAVE_IDEMPOTENCIA_CONFLITANTE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "500":
          description: ERRO_INTERNO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "503":
          description: SERVICO_INDISPONIVEL — banco ou serviço de identidade fora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /prontuario/{pessoaId}:
    get:
      summary: Prontuário de uma pessoa, com itens
      tags:
        - prontuario
      parameters:
        - name: pessoaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
