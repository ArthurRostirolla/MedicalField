  /sync/alteracoes:
    get:
      summary: "Descida por cursor: o que mudou desde `desde`"
      tags:
        - sync
      parameters:
        - name: desde
          in: query
          required: false
          schema:
            default: "0"
            type: string
            pattern: ^\d{1,18}$
        - name: limite
          in: query
          required: false
          schema:
