[project]
name = "jaiminho"
version = "0.1.0"
description = "MedicalField — geração da ficha de atendimento em PDF e envio por e-mail"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "psycopg[binary,pool]>=3.2",
  "weasyprint>=63",
  "jinja2>=3.1",
  "segno>=1.6",
  "aiosmtplib>=3.0",
  "PyJWT[crypto]>=2.9",
  "httpx>=0.27",
  "tzdata",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "pypdf>=5",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaiminho"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003", # textos em português usam travessão e símbolos (×, º)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S310"]
"exemplos/**" = ["S101"]
